name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: bun install --frozen-lockfile
      - run: python -m pip install --requirement src-tauri/sidecar/requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --name ebook-generator src-tauri/sidecar/generator.py
      - run: mkdir -p src-tauri/binaries && mv dist/ebook-generator src-tauri/binaries/ebook-generator
      - run: bun run tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CLA-Ebooks-Creator-${{ matrix.name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
